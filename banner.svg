<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jocelyn Apodaca — signal to threat, dispatch to red team">
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2a24" stroke-width="1"/>
    </pattern>
    <clipPath id="radarClip"><circle cx="940" cy="150" r="120"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="#0b0f0d"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- radar -->
  <g fill="none" stroke="#00ff9c" stroke-opacity="0.35">
    <circle cx="940" cy="150" r="120"/>
    <circle cx="940" cy="150" r="80"/>
    <circle cx="940" cy="150" r="40"/>
    <path d="M820 150H1060M940 30V270"/>
  </g>
  <g clip-path="url(#radarClip)">
    <path d="M940 150 L1060 150 A120 120 0 0 0 1025 65 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0 940 150" to="360 940 150" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- contacts on the scope -->
  <circle cx="985" cy="105" r="4" fill="#00ff9c">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="190" r="3" fill="#00ff9c" opacity="0.6"/>
  <g>
    <circle cx="1000" cy="200" r="5" fill="#ff4d4d">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1012" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff4d4d">THREAT</text>
  </g>

  <!-- text -->
  <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#00ff9c" letter-spacing="3">&gt; UNIT ONLINE_</text>
  <text x="64" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e8f5ee">Jocelyn Apodaca</text>
  <text x="64" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8fb3a2">dispatch → detection → red team</text>
  <text x="64" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#4f6b5e">find the signal · act fast · break it before they do</text>
</svg>
